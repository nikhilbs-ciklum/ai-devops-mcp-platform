name: MCP server checks

on:
  push:
    branches:
      - develop
      - 'feature/**'
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
